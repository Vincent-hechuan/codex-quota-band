<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex额度 · 两页手环预览</title>
  <style>
    :root{--bg:#0d1012;--ink:#f7f8f9;--muted:#b7c1c4;--line:#354248;--green:#59ddb8;--yellow:#ffd05e;--red:#ff7e7e;--grey:#b5bec1}
    *{box-sizing:border-box}body{margin:0;background:#e9eff1;color:#263237;font:14px system-ui,"Microsoft YaHei",sans-serif}header{max-width:1100px;margin:auto;padding:27px 20px 8px}h1{margin:0 0 6px;font-size:21px}header p{margin:0;color:#59676d}.gallery{max-width:1100px;margin:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}.case{margin:0}.case figcaption{margin:0 0 9px;font-weight:700}.watch{position:relative;width:212px;height:520px;margin:auto;overflow:hidden;border-radius:50px;background:var(--bg);color:var(--ink);box-shadow:0 12px 25px #6d7e8330}.page{position:absolute;inset:0;padding:17px 20px 28px}.time{height:29px;font-size:28px;font-weight:850;line-height:29px;text-align:center}.name{margin-top:3px;font-size:20px;font-weight:750;line-height:24px;text-align:center}.dots{position:absolute;right:13px;top:126px;width:11px;align-items:center;flex-direction:column}.dot{width:7px;height:7px;margin:4px 0;border-radius:4px;background:#526167}.dot.active{background:var(--ink)}.sync{width:max-content;min-width:112px;height:27px;margin:10px auto 0;padding:0 11px;border:1px solid #329b7e;border-radius:14px;color:#effff9;font-size:12px;font-weight:750;line-height:25px;text-align:center}.sync.cache{border-color:#77858a;color:#d8e0e1}.quota{margin-top:17px;text-align:center}.label{display:block;color:var(--muted);font-size:16px;font-weight:650;line-height:20px}.quota-number{display:block;margin-top:1px;font-size:76px;font-weight:850;letter-spacing:-2px;line-height:82px}.yellow{color:var(--yellow)}.green{color:var(--green)}.red{color:var(--red)}.grey{color:var(--grey)}.date{display:block;color:var(--muted);font-size:18px;line-height:23px}.divider{height:1px;margin:23px 0 15px;background:var(--line)}.reset-label{display:block;color:var(--muted);font-size:17px;text-align:center}.reset-value{display:block;margin-top:0;font-size:57px;font-weight:850;line-height:65px;text-align:center}.reset-value small{font-size:22px}.expiry{display:block;color:var(--muted);font-size:17px;text-align:center}.up-cue{position:absolute;bottom:17px;left:0;right:0;color:#829397;font-size:16px;text-align:center}.task-head{margin-top:18px;text-align:center}.task-head b{display:block;font-size:22px;line-height:26px}.task-head span{display:block;margin-top:2px;color:var(--muted);font-size:15px}.tasks{margin-top:10px}.task{min-height:70px;padding:8px 0 7px;border-bottom:1px solid #2c373c}.task-title{display:block;height:36px;overflow:hidden;font-size:16px;font-weight:650;line-height:18px}.meta{display:flex;justify-content:space-between;margin-top:3px;font-size:15px;font-weight:750;line-height:17px}.meta .time{height:auto;color:var(--muted);font-size:15px;font-weight:500;line-height:17px;white-space:nowrap}.empty{margin-top:34px;color:var(--muted);font-size:17px;text-align:center}.down-cue{position:absolute;bottom:17px;left:0;right:0;color:#829397;font-size:16px;text-align:center}.caption{max-width:1060px;margin:0 auto 36px;padding:0 20px;color:#536168;font-size:12px}.caption code{background:#dce5e7;padding:1px 4px;border-radius:3px}
    /* Final compact shared header and calmer first-page vertical rhythm. */
    /* Time intentionally occupies the upper curved display area; primary content stays below it. */
    .single-preview .watch{position:fixed;top:0;left:0;margin:0}.page{padding-top:0}.overview-page{transform:none}.overview-spacer{height:112px}.task-page{padding-top:0}.time{position:absolute;top:4px;left:20px;width:172px;height:24px;font-size:22px;line-height:24px}.name{position:absolute;top:30px;left:20px;width:172px;margin:0}.sync{position:absolute;top:57px;left:50px;margin:0}.dots,.overview-dots,.task-dots{position:absolute;display:flex;right:10px;top:208px}.overview-clock,.task-clock{position:absolute;top:4px;left:20px;width:172px;height:24px;font-size:22px;font-weight:850;line-height:24px;text-align:center}.overview-page-title,.task-page-title{position:absolute;top:30px;left:20px;width:172px;font-size:20px;font-weight:750;line-height:24px;text-align:center}.overview-sync,.task-sync{position:absolute;top:57px;left:50px;width:max-content;min-width:112px;height:27px;padding:0 11px;border:1px solid #329b7e;border-radius:14px;color:#effff9;font-size:12px;font-weight:750;line-height:25px;text-align:center}.overview-sync.cache,.task-sync.cache{border-color:#77858a;color:#d8e0e1}.quota{margin-top:28px}.task-content{position:absolute;top:112px;left:20px;width:156px}.task-head{margin-top:0}.divider{margin:30px 0 15px}.up-cue,.down-cue{display:none}
  </style>
</head>
<body>
  <header><h1>Codex额度 · 两页上下切换预览</h1><p>两页均为严格 212×520；右侧双点表示页序。上下滑切页，侧边滑动交给系统返回。</p></header>
  <main class="gallery" id="gallery"></main>
  <p class="caption">预览只使用当前 Vela 项目已验证的纯色、边框、圆角、文本和 flex 语义；正式实现会以纵向 <code>swiper</code> 承载两页，首屏不再使用长页面滚动。</p>
  <script>
    const states={
      overview:{caption:'第 1 页 · 正常额度与重置',page:0,sync:'已同步 15:42',quota:'34%',tone:'yellow',date:'8月5日重置',resets:'1',expiry:'8月1日到期'},
      tasks:{caption:'第 2 页 · 正常任务',page:1,sync:'已同步 15:42',tasks:[['整理手环页面信息架构','处理中','刚刚','green'],['核对 Windows 同步状态','处理中','3分','green'],['汇总设备验收记录','等待查看','12分','yellow']]},
      cached:{caption:'第 1 页 · 缓存',page:0,sync:'缓存 15:24',quota:'34%',tone:'grey',date:'8月5日重置',resets:'1',expiry:'8月1日到期'},
      authorization:{caption:'第 2 页 · 需要授权',page:1,sync:'已同步 15:42',tasks:[['确认本地构建命令的执行权限','需要授权','2分','red'],['整理手环页面信息架构','处理中','刚刚','green']]},
      empty:{caption:'第 2 页 · 空任务',page:1,sync:'已同步 15:42',tasks:[]},
      low:{caption:'第 1 页 · 低额度',page:0,sync:'已同步 15:42',quota:'12%',tone:'red',date:'8月5日重置',resets:'0',expiry:'暂无可用重置'},
      high:{caption:'第 1 页 · 高额度',page:0,sync:'已同步 15:42',quota:'76%',tone:'green',date:'8月5日重置',resets:'2',expiry:'8月1日到期'}
    }
    const esc=(v)=>v.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
    const header=(page,sync,title)=>`<div class="time">15:42</div><div class="name">${title}</div><div class="dots"><i class="dot ${page===0?'active':''}"></i><i class="dot ${page===1?'active':''}"></i></div><div class="sync ${sync.startsWith('缓存')?'cache':''}">${sync}</div>`
    const overviewHeader=(sync)=>`<div class="overview-clock">15:42</div><div class="overview-page-title">codex额度</div><div class="overview-dots"><i class="dot active"></i><i class="dot"></i></div><div class="overview-sync ${sync.startsWith('缓存')?'cache':''}">${sync}</div>`
    const overview=(s)=>`<div class="overview-spacer"></div>${overviewHeader(s.sync)}<section class="quota"><span class="label">周额度</span><b class="quota-number ${s.tone}">${s.quota}</b><span class="date">${s.date}</span></section><div class="divider"></div><section><span class="reset-label">可用重置</span><b class="reset-value ${s.tone}">${s.resets}<small> 次</small></b><span class="expiry">${s.expiry}</span></section>`
    const taskHeader=(sync)=>`<div class="task-clock">15:42</div><div class="task-page-title">任务</div><div class="task-dots"><i class="dot"></i><i class="dot active"></i></div><div class="task-sync ${sync.startsWith('缓存')?'cache':''}">${sync}</div>`
    const tasks=(s)=>`${taskHeader(s.sync)}<div class="task-content"><section class="task-head"><span>${s.tasks.length}项任务</span></section>${s.tasks.length?`<div class="tasks">${s.tasks.map(t=>`<div class="task"><span class="task-title">${esc(t[0])}</span><div class="meta"><span class="${t[3]}">${t[1]}</span><span class="time">${t[2]}</span></div></div>`).join('')}</div>`:'<div class="empty">当前没有活动任务</div>'}</div>`
    const render=(id,s)=>`<figure class="case" data-case="${id}"><figcaption>${s.caption}</figcaption><div class="watch"><div class="page ${s.page===1?'task-page':'overview-page'}">${s.page===0?overview(s):tasks(s)}</div></div></figure>`
    const gallery=document.querySelector('#gallery');gallery.innerHTML=Object.entries(states).map(([id,s])=>render(id,s)).join('')
    const selected=new URLSearchParams(location.search).get('case');if(selected&&states[selected]){document.documentElement.style.cssText='width:212px;height:520px;overflow:hidden';document.body.className='single-preview';document.body.style.cssText='margin:0;width:212px;height:520px;overflow:hidden';document.querySelector('header').style.display='none';document.querySelector('.caption').style.display='none';document.querySelectorAll('[data-case]').forEach(x=>x.style.display=x.dataset.case===selected?'block':'none');gallery.style.cssText='display:block;margin:0;padding:0';const active=document.querySelector(`[data-case="${selected}"]`);active.style.margin='0';active.style.width='212px';active.querySelector('figcaption').style.display='none';active.querySelector('.watch').style.margin='0';requestAnimationFrame(()=>window.scrollTo(0,0));setTimeout(()=>window.scrollTo(0,0),50)}
  </script>
</body>
</html>
