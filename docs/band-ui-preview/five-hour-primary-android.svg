<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title description">
  <title id="title">Codex额度 Android 五小时主额度预览</title>
  <desc id="description">五小时额度使用现有大圆环，周额度在同一卡片内使用横向进度条，可用重置压缩为紧凑卡片。</desc>
  <defs>
    <linearGradient id="pageBackground" x1="0" y1="0" x2="390" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f8fa"/>
      <stop offset=".54" stop-color="#eef2ee"/>
      <stop offset="1" stop-color="#f7f0e9"/>
    </linearGradient>
    <radialGradient id="pageGlow" cx="0" cy="0" r="1" gradientTransform="translate(34 60) rotate(48) scale(320 320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8ebf8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#d8ebf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6d7e83" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="390" height="844" fill="url(#pageBackground)"/>
  <rect width="390" height="844" fill="url(#pageGlow)"/>

  <text x="20" y="55" fill="#20262a" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="600" letter-spacing="-1">Codex额度</text>
  <text x="20" y="76" fill="#68747d" font-family="Microsoft YaHei, sans-serif" font-size="11">额度与当前任务</text>

  <g aria-label="同步状态胶囊" filter="url(#softShadow)">
    <rect x="284" y="36" width="90" height="30" rx="15" fill="#f6f9f9" stroke="#ffffff" stroke-width="1"/>
    <circle cx="299" cy="51" r="3" fill="#176faf"/>
    <text x="309" y="55" fill="#176faf" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="700">已同步</text>
  </g>

  <g aria-label="额度主卡" filter="url(#softShadow)">
    <rect x="16" y="99" width="358" height="337" rx="32" fill="#f9fbfb" stroke="#ffffff" stroke-width="1"/>
    <text x="36" y="130" fill="#20262a" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="600">5小时额度</text>

    <circle cx="195" cy="228" r="84" fill="none" stroke="#68747d" stroke-opacity=".14" stroke-width="8"/>
    <circle cx="195" cy="228" r="84" fill="none" stroke="#198052" stroke-width="8" stroke-linecap="round" stroke-dasharray="358.9 527.8" transform="rotate(-90 195 228)"/>
    <circle cx="195" cy="228" r="76" fill="#f9fbfb" stroke="#ffffff" stroke-width="1"/>
    <text x="217" y="242" text-anchor="end" fill="#198052" font-family="Microsoft YaHei, sans-serif" font-size="56" font-weight="600" letter-spacing="-1">68</text>
    <text x="222" y="242" fill="#198052" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="600">%</text>
    <text x="36" y="329" fill="#68747d" font-family="Microsoft YaHei, sans-serif" font-size="11">18:20重置</text>

    <rect x="36" y="350" width="318" height="1" fill="#68747d" opacity=".15"/>

    <text x="36" y="378" fill="#20262a" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="600">周额度</text>
    <text x="354" y="378" text-anchor="end" fill="#a96e00" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700">34%</text>
    <rect x="36" y="392" width="318" height="8" rx="4" fill="#68747d" opacity=".14"/>
    <rect x="36" y="392" width="108" height="8" rx="4" fill="#a96e00"/>
    <text x="36" y="421" fill="#68747d" font-family="Microsoft YaHei, sans-serif" font-size="11">8月5日重置</text>
  </g>

  <g aria-label="设备连接胶囊" filter="url(#softShadow)">
    <rect x="18" y="451" width="354" height="76" rx="28" fill="#f6f9f9" stroke="#ffffff" stroke-width="1"/>
    <rect x="194.5" y="470" width="1" height="38" fill="#68747d" opacity=".15"/>
    <rect x="81" y="472" width="16" height="11" rx="1" fill="none" stroke="#68747d" stroke-width="1.5"/>
    <path d="M86 486h6M89 483v3" fill="none" stroke="#68747d" stroke-width="1.5" stroke-linecap="round"/>
    <text x="105" y="483" fill="#20262a" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="600">电脑</text>
    <text x="107" y="505" text-anchor="middle" fill="#198052" font-family="Microsoft YaHei, sans-serif" font-size="11">已连接</text>
    <rect x="258" y="470" width="12" height="18" rx="4" fill="none" stroke="#68747d" stroke-width="1.5"/>
    <text x="278" y="483" fill="#20262a" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="600">手环</text>
    <text x="284" y="505" text-anchor="middle" fill="#198052" font-family="Microsoft YaHei, sans-serif" font-size="11">已连接</text>
  </g>

  <text x="20" y="560" fill="#20262a" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="600">当前任务</text>
  <text x="335" y="560" fill="#176faf" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="700">查看全部</text>
  <g filter="url(#softShadow)">
    <rect x="18" y="575" width="354" height="66" rx="24" fill="#f6f9f9" stroke="#ffffff" stroke-width="1"/>
    <text x="31" y="603" fill="#20262a" font-family="Microsoft YaHei, sans-serif" font-size="13">整理 Android 页面信息</text>
    <text x="31" y="624" fill="#68747d" font-family="Microsoft YaHei, sans-serif" font-size="11">处理中 · 修改文件 · 1分</text>
  </g>

  <g aria-label="可用重置紧凑卡" filter="url(#softShadow)">
    <rect x="18" y="656" width="354" height="62" rx="24" fill="#f6f9f9" stroke="#ffffff" stroke-width="1"/>
    <text x="31" y="683" fill="#20262a" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="600">可用重置</text>
    <text x="357" y="690" text-anchor="end" fill="#176faf" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700">1 次</text>
    <text x="31" y="703" fill="#68747d" font-family="Microsoft YaHei, sans-serif" font-size="11">8月1日到期</text>
  </g>

  <g aria-label="底部导航" filter="url(#softShadow)">
    <rect x="15" y="758" width="360" height="59" rx="28" fill="#f6f9f9" stroke="#ffffff" stroke-width="1"/>
    <rect x="20" y="763" width="113" height="49" rx="22" fill="#f9fbfb"/>
    <path d="M66 789l9-8 9 8v10h-6v-7h-6v7h-6z" fill="none" stroke="#176faf" stroke-width="2" stroke-linejoin="round"/>
    <path d="M188 781h14M188 788h14M188 795h14M183 781h1M183 788h1M183 795h1" fill="none" stroke="#68747d" stroke-width="2" stroke-linecap="round"/>
    <circle cx="309" cy="789" r="7" fill="none" stroke="#68747d" stroke-width="2"/>
    <path d="M309 778v3M309 797v3M298 789h3M317 789h3M301 781l2 2M315 795l2 2M317 781l-2 2M303 795l-2 2" fill="none" stroke="#68747d" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
